name: tp-docker-m2

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  api:
    build:
      context: .
      target: runtime
      secrets: [pip_token]
    image: ${API_IMAGE:-tp-docker-m2-api:local}
    <<: *hardening
    environment: &db-connection
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-appdb}
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    ports: ["127.0.0.1:5000:5000"]
    networks: [frontend, backend]
    tmpfs: ["/tmp:size=16m"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    pids_limit: 100

  db:
    image: cgr.dev/chainguard/postgres@sha256:b32c0efe4c15bbc08fcd801f619a7d98d44f3f8eca3ec89efad4941a56e8741c
    <<: *hardening
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0700
      - /tmp:size=64m
    networks: [backend]
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "${POSTGRES_USER:-appuser}",
          "-d",
          "${POSTGRES_DB:-appdb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    pids_limit: 200
    shm_size: 128m

  tests:
    profiles: [test]
    image: cgr.dev/chainguard/python:latest-dev@sha256:dde1a2549dd62864f0263dae8e877680837b4e738a7ecc85c671c55c069848ac
    <<: *hardening
    user: "65532:65532"
    working_dir: /work
    environment:
      <<: *db-connection
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /tmp/deps
    volumes: [".:/work:ro"]
    secrets: [db_password]
    networks: [frontend, backend]
    tmpfs: ["/tmp:size=128m,exec"]
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        python -m pip install --no-cache-dir --no-compile --target=/tmp/deps -r requirements.txt pytest==9.1.1
        python -m pytest -v -p no:cacheprovider

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  db-data: {}

secrets:
  db_password:
    file: ./secrets/db_password.txt
  pip_token:
    file: ./secrets/pip_token.txt
