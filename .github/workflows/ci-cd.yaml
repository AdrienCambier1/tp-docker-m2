name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API_IMAGE: tp-docker-m2-api:ci
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  DIVE_IMAGE: wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10
  SYFT_IMAGE: anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
  GRYPE_IMAGE: anchore/grype:v0.121.0@sha256:621d56d1d68106b787022c81546f7e0a36202a25d1239f0c20195fab8c16f7ea
  COSIGN_VERSION: v3.1.4
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  flake8:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install --no-cache-dir flake8==7.4.1
      - run: python -m flake8 --config .flake8 .

  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Hadolint et digests des images de base
        run: |
          docker run --rm -v "$PWD":/work:ro -w /work "$HADOLINT_IMAGE" hadolint --config .hadolint.yaml Dockerfile
          if grep '^FROM ' Dockerfile | grep -vE '@sha256:[a-f0-9]{64}( AS [a-zA-Z0-9_-]+)?$'; then
            echo "::error::Une image de base n'est pas épinglée par digest."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [flake8, hadolint]
    permissions:
      contents: read
    outputs:
      db-image: ${{ steps.db.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Image PostgreSQL utilisée par Compose
        id: db
        run: |
          image=$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["db"]["image"])')
          [[ "$image" =~ ^cgr\.dev/chainguard/postgres@sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Jeton de build simulé
        env:
          PIP_TOKEN: ${{ secrets.PIP_TOKEN }}
        run: |
          mkdir -p secrets
          if [ -z "$PIP_TOKEN" ]; then
            PIP_TOKEN="ghp_$(openssl rand -hex 18)"
          fi
          echo "::add-mask::$PIP_TOKEN"
          printf '%s' "$PIP_TOKEN" > secrets/pip_token.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build API (bake, amd64)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          files: docker-bake.hcl
          targets: api-ci
      - name: Aucune trace du jeton dans l'image
        run: |
          token=$(cat secrets/pip_token.txt)
          docker save "$API_IMAGE" -o api-image.tar
          if docker history --no-trunc "$API_IMAGE" | grep -qF "$token" \
            || docker image inspect "$API_IMAGE" | grep -qF "$token" \
            || grep -aqF "$token" api-image.tar; then
            echo "::error::Le jeton de build est présent dans l'image."
            exit 1
          fi
          rm -f secrets/pip_token.txt
      - name: Dive (efficience >= 80 %)
        run: |
          docker run --rm -e CI=true -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.dive-ci":/.dive-ci:ro "$DIVE_IMAGE" --ci-config /.dive-ci "$API_IMAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-image
          path: api-image.tar
          retention-days: 1

  supply-chain:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    env:
      DB_IMAGE: ${{ needs.build.outputs.db-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: api-image
      - run: docker load -i api-image.tar
      - name: SBOM CycloneDX et SPDX (Syft, analyse statique)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/out "$SYFT_IMAGE" \
            "docker:$API_IMAGE" -q -o cyclonedx-json=/out/sbom.cdx.json -o spdx-json=/out/sbom.spdx.json
      - name: Statistiques du SBOM
        run: |
          {
            echo "### SBOM"
            echo "- Composants CycloneDX (hors fichiers) : $(jq '[.components[] | select(.type != "file")] | length' sbom.cdx.json)"
            echo "- Paquets SPDX : $(jq '.packages | length' sbom.spdx.json)"
            echo "- PURL : $(jq '[.components[] | select(.purl)] | length' sbom.cdx.json)"
            echo "- Licences : $(jq -r '[.components[].licenses[]? | .license.id // .license.name // .expression] | unique | join(", ")' sbom.cdx.json)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.spdx.json
      - name: Trivy (HIGH et CRITICAL corrigeables, VEX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache -v "$PWD":/work:ro \
            "$TRIVY_IMAGE" image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --vex /work/security.vex.json --exit-code 1 "$API_IMAGE"
          docker run --rm -v "$PWD":/work:ro -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /work
          docker run --rm -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$DB_IMAGE"
      - name: Grype sur le SBOM filtré par VEX
        run: |
          docker run --rm -v "$PWD":/work:ro -w /work -v grype-db:/grype-db -e GRYPE_DB_CACHE_DIR=/grype-db \
            "$GRYPE_IMAGE" sbom:/work/sbom.cdx.json -c /work/.grype.yaml
          docker run --rm -v "$PWD":/work:ro -w /work -v grype-db:/grype-db -e GRYPE_DB_CACHE_DIR=/grype-db \
            -e GRYPE_DB_AUTO_UPDATE=false "$GRYPE_IMAGE" sbom:/work/sbom.cdx.json -c /work/.grype.yaml -o json \
            | jq -r '.ignoredMatches[]? | "\(.vulnerability.id) \(.artifact.name) -> \(.appliedIgnoreRules | map(."vex-status" // ."fix-state") | join(","))"'

  integration:
    runs-on: ubuntu-latest
    needs: [supply-chain]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: api-image
      - name: Préparer les tests
        run: |
          docker load -i api-image.tar
          mkdir -p secrets
          openssl rand -hex 32 > secrets/db_password.txt
      - run: docker compose up -d --no-build --wait --wait-timeout 120
      - run: docker compose ps
      - name: Smoke test HTTP
        run: |
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:5000/health
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:5000/dbtest
      - name: pytest fourni dans le sujet
        run: docker compose run --rm --no-deps tests
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs
      - name: Nettoyage
        if: always()
        run: docker compose down -v --remove-orphans

  release:
    runs-on: ubuntu-latest
    needs: [build, integration]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DB_IMAGE: ${{ needs.build.outputs.db-image }}
    outputs:
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
      platform-digests: ${{ steps.digest.outputs.platform-digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Noms des packages
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          {
            echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
            echo "IMAGE=${repo#*/}-api"
            echo "GHCR_API=ghcr.io/${repo}-api"
            echo "GHCR_DB=ghcr.io/${repo}-db"
          } >> "$GITHUB_ENV"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ${{ env.GHCR_API }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,format=short
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Jeton de build simulé
        env:
          PIP_TOKEN: ${{ secrets.PIP_TOKEN }}
        run: |
          mkdir -p secrets
          if [ -z "$PIP_TOKEN" ]; then
            PIP_TOKEN="ghp_$(openssl rand -hex 18)"
          fi
          echo "::add-mask::$PIP_TOKEN"
          printf '%s' "$PIP_TOKEN" > secrets/pip_token.txt
      - name: Tags pour bake
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "TAGS=$(sed '/^$/d; s/.*://' <<< "$META_TAGS" | paste -sd, -)" >> "$GITHUB_ENV"
          echo "VERSION=$META_VERSION" >> "$GITHUB_ENV"
      - name: Build et push multi-architecture (bake)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          files: docker-bake.hcl
          targets: api
          push: true
      - run: rm -f secrets/pip_token.txt
      - name: Digest immuable de l'index
        id: digest
        run: |
          manifest=$(docker buildx imagetools inspect "${GHCR_API}:${VERSION}" --format '{{json .Manifest}}')
          digest=$(jq -r '.digest' <<< "$manifest")
          platforms=$(jq -c '[.manifests[] | select(.platform.os == "linux") | {arch: .platform.architecture, digest}]' <<< "$manifest")
          [ "$(jq -r 'map(.arch) | sort | join(" ")' <<< "$platforms")" = "amd64 arm64" ]
          {
            echo "image=${GHCR_API}"
            echo "digest=${digest}"
            echo "platform-digests=${platforms}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "DIGEST=${digest}"
            echo "PLATFORMS=${platforms}"
          } >> "$GITHUB_ENV"
          echo "Index publié : ${GHCR_API}:${VERSION}@${digest}" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Signature sans clé (OIDC) de l'index et des variantes
        run: cosign sign --yes --recursive "${GHCR_API}@${DIGEST}"
      - name: SBOM des images publiées et attestations signées
        run: |
          for row in $(jq -r '.[] | "\(.arch)=\(.digest)"' <<< "$PLATFORMS"); do
            arch="${row%%=*}"
            ref="${GHCR_API}@${row#*=}"
            docker run --rm -v "$PWD":/out "$SYFT_IMAGE" "registry:${ref}" -q \
              -o "cyclonedx-json=/out/sbom-${arch}.cdx.json" -o "spdx-json=/out/sbom-${arch}.spdx.json"
            cosign attest --yes --type cyclonedx --predicate "sbom-${arch}.cdx.json" "$ref"
            cosign attest --yes --type spdxjson --predicate "sbom-${arch}.spdx.json" "$ref"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom-published
          path: sbom-*.json
      - name: Publier l'image PostgreSQL
        env:
          TAGS_LIST: ${{ steps.meta.outputs.tags }}
        run: |
          db_tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            db_tags+=(-t "${GHCR_DB}:${tag##*:}")
          done <<< "$TAGS_LIST"
          docker buildx imagetools create "${db_tags[@]}" "$DB_IMAGE"

  verify:
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      packages: read
    env:
      IMAGE: ${{ needs.release.outputs.image }}
      DIGEST: ${{ needs.release.outputs.digest }}
      PLATFORMS: ${{ needs.release.outputs.platform-digests }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Signature de l'index (registre distant)
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/ci-cd.yaml@${GITHUB_REF}" \
            --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
      - name: Signatures et attestations SBOM de chaque architecture
        run: |
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/ci-cd.yaml@${GITHUB_REF}"
          for row in $(jq -r '.[] | "\(.arch)=\(.digest)"' <<< "$PLATFORMS"); do
            arch="${row%%=*}"
            ref="${IMAGE}@${row#*=}"
            cosign verify "$ref" --certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
            for type in cyclonedx spdxjson; do
              cosign verify-attestation "$ref" --type "$type" \
                --certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER" > "att-${arch}-${type}.json"
            done
            count=0
            while IFS= read -r payload; do
              components=$(base64 -d <<< "$payload" | jq '[.predicate.components[] | select(.type != "file")] | length')
              [ "$components" -gt 0 ]
              count=$((count + 1))
            done < <(jq -r '.payload' "att-${arch}-cyclonedx.json")
            [ "$count" -gt 0 ]
            echo "- ${arch} : signature valide, ${count} attestation(s) SBOM valides, ${components} composants" >> "$GITHUB_STEP_SUMMARY"
          done
