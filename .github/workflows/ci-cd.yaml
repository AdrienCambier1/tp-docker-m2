name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API_IMAGE: tp-docker-m2-api:ci
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  DIVE_IMAGE: wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10

jobs:
  flake8:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: python -m pip install --no-cache-dir flake8==7.4.1
      - run: python -m flake8 --config .flake8 .

  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Hadolint et digests des images de base
        run: |
          docker run --rm -v "$PWD":/work:ro -w /work "$HADOLINT_IMAGE" hadolint --config .hadolint.yaml Dockerfile
          if grep '^FROM ' Dockerfile | grep -vE '@sha256:[a-f0-9]{64}( AS [a-zA-Z0-9_-]+)?$'; then
            echo "::error::Une image de base n'est pas épinglée par digest."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [flake8, hadolint]
    permissions:
      contents: read
    outputs:
      db-image: ${{ steps.db.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Image PostgreSQL utilisée par Compose
        id: db
        run: |
          image=$(docker compose config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["db"]["image"])')
          [[ "$image" =~ ^cgr\.dev/chainguard/postgres@sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          tags: ${{ env.API_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Dive (efficience >= 80 %)
        run: |
          docker run --rm -e CI=true -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.dive-ci":/.dive-ci:ro "$DIVE_IMAGE" --ci-config /.dive-ci "$API_IMAGE"
      - run: docker save "$API_IMAGE" -o api-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-image
          path: api-image.tar
          retention-days: 1

  trivy:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    env:
      DB_IMAGE: ${{ needs.build.outputs.db-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: api-image
      - run: docker load -i api-image.tar
      - name: Trivy (HIGH et CRITICAL corrigeables)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$API_IMAGE"
          docker run --rm -v "$PWD":/work:ro -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /work
          docker run --rm -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$DB_IMAGE"

  integration:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: api-image
      - name: Préparer les tests
        run: |
          docker load -i api-image.tar
          mkdir -p secrets
          openssl rand -hex 32 > secrets/db_password.txt
      - run: docker compose up -d --no-build --wait --wait-timeout 120
      - run: docker compose ps
      - name: Smoke test HTTP
        run: |
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:5000/health
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:5000/dbtest
      - name: pytest fourni dans le sujet
        run: docker compose run --rm --no-deps tests
      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs
      - name: Nettoyage
        if: always()
        run: docker compose down -v --remove-orphans

  release:
    runs-on: ubuntu-latest
    needs: [build, trivy, integration]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      DB_IMAGE: ${{ needs.build.outputs.db-image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: api-image
      - run: docker load -i api-image.tar
      - name: Noms des packages
        run: |
          echo "GHCR_API=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"
          echo "GHCR_DB=ghcr.io/${GITHUB_REPOSITORY,,}-db" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ${{ env.GHCR_API }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,format=short
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Publier les images validées
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          db_tags=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$API_IMAGE" "$tag"
            docker push "$tag"
            db_tags+=(-t "${GHCR_DB}:${tag##*:}")
          done <<< "$TAGS"
          docker buildx imagetools create "${db_tags[@]}" "$DB_IMAGE"
