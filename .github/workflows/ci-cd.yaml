name: CI/CD - Hardened Flask & PostgreSQL

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

# Moindre privilège : aucune permission par défaut, chaque job déclare
# explicitement le strict nécessaire.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API_IMAGE: tp-docker-m2-api:ci
  # Outils exécutés en conteneur, épinglés par digest SHA256 (immuables)
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  DIVE_IMAGE: wagoodman/dive:v0.13.1@sha256:f1886e6c32c094fc41a623c1989f5cb3e48aa766da5f0be233f911fc1d85ce10
  DB_IMAGE: cgr.dev/chainguard/postgres@sha256:0c4eaf6cb9bd65337d834f5ebfe79add4312ee2125ab584bf1fbc071abc6bb8f

jobs:
  # ---------------------------------------------------------------------------
  # 1. Qualité applicative (Flake8)
  # ---------------------------------------------------------------------------
  flake8:
    name: Lint Python (Flake8)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Flake8
        run: pip install --no-cache-dir flake8==7.4.1

      - name: Flake8 (configuration du projet)
        run: flake8 --config .flake8 .

  # ---------------------------------------------------------------------------
  # 2. Analyse statique conteneur (Hadolint)
  # ---------------------------------------------------------------------------
  hadolint:
    name: Lint Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hadolint (.hadolint.yaml)
        run: |
          docker run --rm -v "$PWD":/work:ro -w /work "$HADOLINT_IMAGE" \
            hadolint --config .hadolint.yaml Dockerfile Dockerfile.test

      - name: Toutes les images de base sont épinglées par digest
        run: |
          set -euo pipefail
          if grep -hE '^FROM ' Dockerfile Dockerfile.test | grep -v '@sha256:'; then
            echo "::error::Image de base non épinglée par digest SHA256"
            exit 1
          fi
          grep -E '^\s+image: cgr\.dev/.+@sha256:[a-f0-9]{64}$' docker-compose.yml

  # ---------------------------------------------------------------------------
  # 3. Build BuildKit + métrologie des couches (Dive)
  # ---------------------------------------------------------------------------
  build:
    name: Build & Dive
    runs-on: ubuntu-latest
    needs: [flake8, hadolint]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx (BuildKit)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.API_IMAGE }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Dive (efficience >= 80 %)
        run: |
          docker run --rm -e CI=true \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.dive-ci":/.dive-ci:ro \
            "$DIVE_IMAGE" --ci-config /.dive-ci "$API_IMAGE"

      - name: Export image
        run: docker save "$API_IMAGE" -o api-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image
          path: api-image.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 4. Sécurité supply chain (Trivy) - bloquant sur HIGH/CRITICAL corrigeables
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-image

      - name: Load image
        run: docker load -i api-image.tar

      - name: Trivy - image API (OS + paquets Python)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "$API_IMAGE"

      - name: Trivy - dépendances applicatives (requirements*.txt)
        run: |
          docker run --rm -v "$PWD":/work:ro -v trivy-cache:/root/.cache \
            "$TRIVY_IMAGE" fs --scanners vuln,secret \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /work

      - name: Trivy - image PostgreSQL
        run: |
          docker run --rm -v trivy-cache:/root/.cache "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$DB_IMAGE"

  # ---------------------------------------------------------------------------
  # 5. Intégration dynamique & smoke tests (Docker Compose)
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (Compose)
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-image

      - name: Load image
        run: docker load -i api-image.tar

      - name: Generate ephemeral DB secret
        run: |
          mkdir -p secrets
          openssl rand -base64 32 | tr -d '\n' > secrets/db_password.txt
          chmod 644 secrets/db_password.txt

      - name: Compose up (attente de l'état sain, timeout 120 s)
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Statut des services
        run: docker compose ps

      - name: Smoke test /health et /dbtest
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:5000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:5000/dbtest | tee /dev/stderr | grep -q '"db_connection":"successful"'

      - name: Tests pytest (réseau backend isolé)
        run: docker compose --profile test run --rm --build tests

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose --profile test logs

      - name: Teardown
        if: always()
        run: docker compose --profile test down -v --remove-orphans --rmi local

  # ---------------------------------------------------------------------------
  # 6. Distribution sécurisée sur GHCR (SemVer) - uniquement si tout est vert
  # ---------------------------------------------------------------------------
  release:
    name: Release GHCR
    runs-on: ubuntu-latest
    needs: [flake8, hadolint, build, trivy, integration]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-image

      - name: Load image
        run: docker load -i api-image.tar

      - name: Image names (lowercase)
        run: |
          echo "GHCR_API=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"
          echo "GHCR_DB=ghcr.io/${GITHUB_REPOSITORY,,}-db" >> "$GITHUB_ENV"

      - name: Tags SemVer
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_API }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,format=short

      - name: Login GHCR (GITHUB_TOKEN)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Push API image (exactement l'image scannée et testée)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "$API_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Publish PostgreSQL image (copie du digest Chainguard épinglé)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            args+=(-t "${GHCR_DB}:${tag##*:}")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$DB_IMAGE"
